workflows:
  ios-testflight:
    name: RideClimb 3D TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 30

    integrations:
      app_store_connect: CodeMagic

    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.alessiosargentini.climb3d

    scripts:
      - name: Verify project
        script: |
          set -e
          test -f "$CM_BUILD_DIR/Climb3D.xcodeproj/project.pbxproj"
          test -f "$CM_BUILD_DIR/Climb3D/Assets.xcassets/AppIcon.appiconset/Contents.json"
          xcodebuild -project "$CM_BUILD_DIR/Climb3D.xcodeproj" -scheme "Climb3D" -showBuildSettings >/dev/null

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          set -o pipefail
          xcode-project build-ipa \
            --project "Climb3D.xcodeproj" \
            --scheme "Climb3D"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
